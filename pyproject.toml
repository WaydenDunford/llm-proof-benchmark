[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proof-benchmark"
version = "0.1.0"
description = "Blind evaluation and readable reports for textual theorem proving"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "rich>=13,<15", "typer>=0.12,<1", "Jinja2>=3.1,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.51,<5", "accelerate>=0.30"]
quantization = ["bitsandbytes>=0.43"]
vllm = ["vllm>=0.8"]
dev = ["pytest>=8,<10"]

[project.scripts]
proof-benchmark = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
